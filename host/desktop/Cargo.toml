[package]
name = "os-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AutoOS 桌面宿主（iced/VM 轨）：虚拟桌面 + shell + 注册表启动"

# PLAN-876 T-02：入口自 auto-lang `examples/ui_desktop.rs` 迁入。
# bin 名 `ui-desktop` → 产物 `ui-desktop.exe`（与既有口头入口一致）。
[[bin]]
name = "ui-desktop"
path = "src/main.rs"

[dependencies]
# 渲染/会话/投影/桌面协议的实现方（auto-ui 独立仓）。
auto-ui-runtime = { path = "../../../auto-ui/crates/auto-ui-runtime", default-features = false, features = ["ui-iced", "mpv-widget"] }
# VM/存储 API（set_ui_host_install_hook、storage_host_read）。
# 刻意**不**依赖 `auto-lang`：桌面宿主不需要编译器层。
auto-lang-core = { path = "../../../auto-lang/crates/auto-lang-core" }
# apps.manifest 直读（PLAN-876 REV2：manifest_repo_roots 会滤掉缺 pac.at 的条目，
# 不能作为 skip 统计的数据源）。
serde_json = "1"
auto-tool-execution = { path = "../../../auto-lang/crates/auto-tool-execution" }
# 源/产物身份 hash（与 provider_digest 同族；PLAN-064 A 最小候选注册表）。
blake3 = "1"

# PLAN-064 M2-A 最小（MIN-A-OS）：ACE 候选见证链，缺省关——
# 关 = `--ace-min` 具名拒（绝不落旧 VM 解释）；开 = 消费 980 已交
# `ace-bridge`（NodeDesktopBridge/AceNodeDesktopWindow）与 969 facade。
[features]
ace-min = ["dep:auto-lang-ace-host", "auto-ui-runtime/ace-bridge"]

[dependencies.auto-lang-ace-host]
path = "../../../auto-lang/crates/auto-lang-ace-host"
optional = true

[dev-dependencies]
